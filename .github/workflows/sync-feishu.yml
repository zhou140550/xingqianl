name: 同步飞书内容

on:
  workflow_dispatch:  # 手动触发
  schedule:
    - cron: '0 */6 * * *'  # 每6小时自动同步一次

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: 同步飞书数据
        run: |
          cat > sync.js << 'JSEOF'
          const https = require('https');
          const fs = require('fs');

          const APP_ID = 'cli_aa99634ff3a3dcda';
          const APP_SECRET = 'O7mPRTLmSiGS9arBWONIDfdLkGRhw1wP';
          const APP_TOKEN = 'PjsUbnliYaxZEesVC9XcLr9Yneg';
          const TABLES = {
            '幼小衔接': 'tblvhEbqTVUvQ4fY',
            '思维课程': 'tblMCkfrK0Qo2JSV',
            '剑桥英语': 'tblMoC3BgrpNZxmx',
            '书法': 'tblxBfDwpl4kDYn0',
            '美术': 'tblp4iZC761S3Hcl',
            '托管': 'tbllCthsVm7KFeWQ',
            '校区介绍': 'tblVtVgF6RkyM6wc'
          };

          function request(options, body) {
            return new Promise((resolve, reject) => {
              const req = https.request(options, res => {
                let data = '';
                res.on('data', c => data += c);
                res.on('end', () => resolve(JSON.parse(data)));
              });
              req.on('error', reject);
              if (body) req.write(body);
              req.end();
            });
          }

          async function main() {
            // 获取token
            const tokenRes = await request({
              hostname: 'open.feishu.cn',
              path: '/open-apis/auth/v3/tenant_access_token/internal',
              method: 'POST',
              headers: { 'Content-Type': 'application/json' }
            }, JSON.stringify({ app_id: APP_ID, app_secret: APP_SECRET }));
            
            const token = tokenRes.tenant_access_token;
            console.log('Token获取成功');

            const allData = {};
            for (const [name, tableId] of Object.entries(TABLES)) {
              const res = await request({
                hostname: 'open.feishu.cn',
                path: `/open-apis/bitable/v1/apps/${APP_TOKEN}/tables/${tableId}/records?page_size=100`,
                method: 'GET',
                headers: { 'Authorization': `Bearer ${token}` }
              });
              
              if (res.data && res.data.items) {
                allData[name] = res.data.items.map(item => ({
                  module: (item.fields['文本'] || '').trim(),
                  content: (item.fields['内容'] || '').trim(),
                  images: (item.fields['图片链接'] || '').trim(),
                  visible: !!(item.fields['是否显示'])
                }));
                console.log(`✅ ${name}: ${allData[name].length}条`);
              }
            }

            fs.writeFileSync('data.json', JSON.stringify(allData, null, 2));
            console.log('data.json 生成完成');
          }

          main().catch(console.error);
          JSEOF
          node sync.js

      - name: 提交data.json
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add data.json
          git diff --staged --quiet || git commit -m "自动同步飞书内容 $(date '+%Y-%m-%d %H:%M')"
          git push
